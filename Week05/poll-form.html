<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta name="viewpart" content="width=device-width, initial-scale=1">
        <title> WDD 130 | HTML Form - User Poll</title>
    </head>
    <body>
        <header>
            <h1>WDD 130 | Jacob Farnsworth | HTML Form - User Poll</h1>
        </header>
        <main>
            <form>
                <fieldset>
                    <legend> Contact Information</legend>
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullnmae" name="fullname">
                    <label for="useremail">Email:</label>
                    <input type="email" id="useremail" name="useremail">
                </fieldset>
                <fieldset>
                    <legend> Question</legend>
                    <label for="borwser">What is your Favorite Browser?</label>
                    <select id="browser" name="browser">
                        <option value="Chrome">Chrome</option>
                        <option value="Firefox">Fire Fox</option>
                        <option vlaue="safari"> Safari</option>
                        <option value="other"> Other</option>
                    </select>
                    <label for="pet"> Do you have a household pet?</label>
                    <input type="checkbox" id="pet" name="pet">
                    <label for="feedback"> List the places you have lived:</label>
                    <textarea id="feedback" name="feedback" rows="4" placeholder="Amarillo, Texas, Paris Texas"></testarea>
                </fieldset>
                <button type="submit">Submit Poll</button>
            </form>
        </main>
        <footer>
            <p>©2024 |HTML Form - User Poll Activity | Jacob Farnsworth </p>
        </footer>
    </body>
</html>
