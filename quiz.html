<!DOCTYPE html>
<html lang="en-us">
    <head>
        <meta charset="utf-8">
        <meta name="viewpart" content="width=device-width, initial-scale=1">
        <title> WDD 130 | Quiz <Form></Form></title>
    </head>
    <body>
        <header>
            <h1>WDD 130 | Jacob Farnsworth | Quiz</h1>
        </header>
        <main>
            <form>
                <fieldset>
                    <label for="q1">What does the acronym HTML stand for?</label>
                    <input type="text" id="q1" name="q1">
                    <label for="q2">What is the difference between HTML and CSS?</label>
                    <textarea id="q2" name="q2" placeholder="Enter answer here"></textarea>
                    <label for="q3">What are the three basic elements of an HTML document?</label>
                    <select id="q3" name="q3">
                       <option value="option 1">head, body, main</option>
                       <option value="option 2">HTML, head, body</option>
                       <option value="option 3">main, footer, section </option>
                       <option value="option 4"> header, body, footer</option>
                    </select>
                    <label for="q4">If you want an image to go all the way across the page what do you set the img width to?</label>
                    <input type="number" id="q4" name="q4">
                </fieldset>
                <button type="submit">Submit Quiz</button>
            </form>
        </main>
    </body>
</html>
